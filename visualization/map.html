
    <!DOCTYPE html>
    <html>
    <head>
        <title>Train Journey Visualization</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <style>
            #map { height: 100vh; width: 100%; margin: 0; padding: 0; }
            body { margin: 0; padding: 0; }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <script>
            var map = L.map('map').setView([47.1701824, 8.0982946], 11);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            var routeCoords = [
                [47.1701824, 8.0982946],
[47.1547679, 8.1146469],
[47.1382198, 8.1394988],
[47.1160322, 8.1956513],
[47.0895819, 8.2469301],
[47.090793, 8.2730958],
[47.0782468, 8.2768282],
[47.0707506, 8.2827391],
[47.0501374, 8.3101508],
[47.0840295, 8.3419103],
[47.0937169, 8.356827],
[47.1048995, 8.3738236],
[47.1210039, 8.3941634],
[47.1418916, 8.4306739],
[47.173731, 8.4502341],
[47.178142, 8.4575792],
[47.1823496, 8.4713965],
[47.1802122, 8.4866025],
[47.1737815, 8.5073414],
[47.1737108, 8.5150286],
[47.1830982, 8.5171234],
[47.1884544, 8.5177083],
[47.19538, 8.5230597]
            ];

            var routeLine = L.polyline(routeCoords, {color: 'red', weight: 4}).addTo(map);
            map.fitBounds(routeLine.getBounds());

            
            L.marker([47.1701824, 8.0982946]).addTo(map)
                .bindPopup("<b>Sursee</b><br>Arr: 18:18:00<br>Dep: 18:18:00");

                .bindPopup("<b>Oberkirch LU</b><br>Arr: 18:20:00<br>Dep: 18:20:00");

    </html>
